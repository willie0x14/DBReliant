services:
  postgres:
    image: postgres:18
    container_name: dbreliant-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dbreliant}
      POSTGRES_USER: ${POSTGRES_USER:-dbreliant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbreliant}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
